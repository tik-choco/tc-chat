name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  # One run per ref: a force-push supersedes the run it interrupted.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # src/vendor/mistlib is committed (built wasm output), so every step below
      # runs directly rather than through the npm scripts, whose pre* lifecycle
      # hooks would try to re-fetch and rebuild mistlib (needs Rust + wasm-pack).
      - name: Typecheck
        run: npx tsc -b

      # Fails on errors only; exhaustive-deps findings are warnings by design
      # (see eslint.config.js) so they surface without blocking a merge.
      - name: Lint
        run: npx eslint .

      - name: Test
        run: npx vitest run

      - name: Build
        run: npx vite build
